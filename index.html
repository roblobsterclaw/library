<style>
  :root {
    --bg: #E2E8F0;
    --card: #FFFFFF;
    --border: #E5E7EB;
    --accent: #1E3A8A;
    --accent-light: #3B82F6;
    --gold: #3B82F6;
    --text: #1A1A2E;
    --text-dim: #6C757D;
    --green: #059669;
    --yellow: #D97706;
    --gray: #9CA3AF;
    --blue: #6366F1;
    --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 16px 48px;
  }

  /* ===== HEADER ===== */
  header {
    text-align: center;
    padding: 32px 16px 20px;
  }

  header h1 {
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  header h1 .accent { color: var(--accent); }

  header .subtitle {
    color: var(--text-dim);
    font-size: 0.95rem;
    margin-top: 6px;
  }

  /* ===== STATS BAR ===== */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 1200px;
    margin: 20px auto 0;
  }

  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    text-align: center;
    box-shadow: var(--card-shadow);
  }

  .stat .num {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.1;
  }

  .stat .label {
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 4px;
  }

  /* ===== STICKY FILTER BAR ===== */
  .filterbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(226, 232, 240, 0.95);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    margin-top: 20px;
  }

  .filterbar-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .search-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 1rem;
    padding: 12px 16px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .search-input::placeholder { color: var(--text-dim); }

  .search-input:focus {
    outline: none;
    border-color: var(--accent-light);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .filter-group .group-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-right: 2px;
    width: 100%;
  }

  .pill {
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.82rem;
    font-family: inherit;
    padding: 7px 13px;
    transition: all 0.18s ease;
    white-space: nowrap;
  }

  .pill:hover {
    border-color: var(--accent-light);
    color: var(--accent);
  }

  .pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFFFFF;
    font-weight: 700;
  }

  .results-count {
    font-size: 0.82rem;
    color: var(--text-dim);
  }

  .results-count strong { color: var(--gold); }

  /* ===== GRID ===== */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    margin-top: 24px;
  }

  /* ===== CARD ===== */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: var(--card-shadow);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent-light);
    box-shadow: 0 8px 24px rgba(30, 58, 138, 0.15);
  }

  .card.has-live {
    border-left: 3px solid var(--accent);
  }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .card-name {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    cursor: pointer;
  }

  .card-name:hover { color: var(--accent); }

  .card-name.linked::after {
    content: " ↗";
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .badge {
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 4px 9px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .badge.status-active { background: var(--green); color: #fff; }
  .badge.status-paused { background: var(--yellow); color: #fff; }
  .badge.status-archived { background: var(--gray); color: #fff; }
  .badge.status-idea { background: var(--blue); color: #fff; }

  .badge.type {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--gold);
  }

  .card-desc {
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    font-size: 0.78rem;
    color: var(--text-dim);
  }

  .meta-row .agents {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .agent-icon {
    font-size: 0.95rem;
    cursor: default;
  }

  .local-path {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    word-break: break-all;
  }

  .links-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 2px;
  }

  .link-btn {
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 7px 12px;
    transition: all 0.18s ease;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
  }

  .link-btn.live {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFFFFF;
  }

  .link-btn.live:hover { filter: brightness(1.1); }

  .link-btn.github:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .link-btn.docs {
    background: var(--green);
    border-color: var(--green);
    color: #FFFFFF;
  }

  .link-btn.docs:hover { filter: brightness(1.1); }

  .card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
    font-size: 0.74rem;
    color: var(--text-dim);
  }

  .branch-info {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    color: var(--gold);
  }

  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 1rem;
  }

  /* ===== FOOTER ===== */
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.82rem;
    padding: 36px 16px 16px;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }

  footer a { color: var(--accent); }
  footer a:hover { text-decoration: underline; }

  /* ===== RESPONSIVE ===== */
  @media (min-width: 640px) {
    header h1 { font-size: 2.4rem; }
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (min-width: 1024px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
    .filterbar-inner { gap: 14px; }
  }
</style>

/* =========================================================
   CONFIG
   ========================================================= */
const AGENTS = {
  rob:           { emoji: "🦞", label: "Rob" },
  hermes:        { emoji: "⚡", label: "Hermes" },
  "claude-code": { emoji: "🔧", label: "Claude Code" },
  codex:         { emoji: "🔨", label: "Codex" },
  joe:           { emoji: "👤", label: "Joe" }
};

const STATUS_LABELS = {
  active:   "Active",
  paused:   "Paused",
  archived: "Archived",
  idea:     "Idea"
};

const TYPE_LABELS = {
  dashboard: "Dashboard",
  website:   "Website",
  app:       "App",
  document:  "Document",
  game:      "Game",
  research:  "Research",
  rendering: "Rendering"
};

const STATUS_ORDER = { active: 0, paused: 1, idea: 2, archived: 3 };

/* Current filter state */
const state = {
  search: "",
  status: "all",
  type: "all",
  agent: "all"
};

/* =========================================================
   HELPERS
   ========================================================= */
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function formatDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

/* Sort: active first (status order), then lastUpdated descending */
function sortProjects(list) {
  return list.slice().sort((a, b) => {
    const sa = STATUS_ORDER[a.status] ?? 9;
    const sb = STATUS_ORDER[b.status] ?? 9;
    if (sa !== sb) return sa - sb;
    return (b.lastUpdated || "").localeCompare(a.lastUpdated || "");
  });
}

/* =========================================================
   STATS BAR
   ========================================================= */
function renderStats() {
  const total   = PROJECTS.length;
  const active  = PROJECTS.filter(p => p.status === "active").length;
  const live    = PROJECTS.filter(p => p.githubPages).length;
  const onGit   = PROJECTS.filter(p => p.githubRepo).length;

  const stats = [
    { num: total,  label: "Total Projects" },
    { num: active, label: "Active" },
    { num: live,   label: "Live on Web" },
    { num: onGit,  label: "On GitHub" }
  ];

  document.getElementById("stats").innerHTML = stats.map(s => `
    <div class="stat">
      <div class="num">${s.num}</div>
      <div class="label">${s.label}</div>
    </div>
  `).join("");
}

/* =========================================================
   FILTER PILLS
   ========================================================= */
function buildPills(containerId, key, options) {
  const container = document.getElementById(containerId);
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "pill" + (state[key] === opt.value ? " active" : "");
    btn.textContent = opt.label;
    btn.dataset.value = opt.value;
    btn.addEventListener("click", () => {
      state[key] = opt.value;
      container.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      render();
    });
    container.appendChild(btn);
  });
}

function buildFilters() {
  buildPills("status-filters", "status", [
    { value: "all",      label: "All" },
    { value: "active",   label: "Active" },
    { value: "paused",   label: "Paused" },
    { value: "archived", label: "Archived" },
    { value: "idea",     label: "Idea" }
  ]);

  buildPills("type-filters", "type", [
    { value: "all",       label: "All Types" },
    { value: "dashboard", label: "Dashboard" },
    { value: "website",   label: "Website" },
    { value: "app",       label: "App" },
    { value: "document",  label: "Document" },
    { value: "game",      label: "Game" },
    { value: "research",  label: "Research" },
    { value: "rendering", label: "Rendering" }
  ]);

  buildPills("agent-filters", "agent", [
    { value: "all",         label: "All Agents" },
    { value: "rob",         label: "🦞 Rob" },
    { value: "hermes",      label: "⚡ Hermes" },
    { value: "claude-code", label: "🔧 Claude Code" },
    { value: "codex",       label: "🔨 Codex" },
    { value: "joe",         label: "👤 Joe" }
  ]);
}

/* =========================================================
   FILTERING
   ========================================================= */
function matches(p) {
  if (state.status !== "all" && p.status !== state.status) return false;
  if (state.type   !== "all" && p.type   !== state.type)   return false;
  if (state.agent  !== "all" && !(p.builtBy || []).includes(state.agent)) return false;

  if (state.search) {
    const q = state.search.toLowerCase();
    const haystack = [p.name, p.description, p.notes, p.localPath]
      .filter(Boolean).join(" ").toLowerCase();
    if (!haystack.includes(q)) return false;
  }
  return true;
}

/* =========================================================
   CARD RENDERING
   ========================================================= */
function renderCard(p) {
  const statusLabel = STATUS_LABELS[p.status] || p.status;
  const typeLabel   = TYPE_LABELS[p.type] || p.type;

  const agents = (p.builtBy || []).map(a => {
    const info = AGENTS[a];
    return info
      ? `<span class="agent-icon" title="${escapeHtml(info.label)}">${info.emoji}</span>`
      : "";
  }).join("");

  const nameLinked = p.githubPages ? " linked" : "";
  const nameClick  = p.githubPages
    ? ` onclick="window.open('${escapeHtml(p.githubPages)}','_blank','noopener')"`
    : "";

  /* Links row */
  let links = "";
  if (p.githubPages) {
    links += `<a class="link-btn live" href="${escapeHtml(p.githubPages)}" target="_blank" rel="noopener">🌐 Live Site</a>`;
  }
  if (p.githubRepo) {
    links += `<a class="link-btn github" href="${escapeHtml(p.githubRepo)}" target="_blank" rel="noopener">📂 GitHub</a>`;
  }
  if (p.icloudFolder) {
    links += `<a class="link-btn docs" href="https://www.icloud.com/iclouddrive/043dz2esR-W2WOZs-KmdIgb1A#JFL_Command_Center" target="_blank" rel="noopener">📁 Documents</a>`;
  }

  /* If no live site, show local path instead */
  let localBlock = "";
  if (!p.githubPages && p.localPath) {
    localBlock = `<div class="local-path" title="Mac Mini path">💻 ${escapeHtml(p.localPath)}</div>`;
  } else if (p.localPath) {
    localBlock = `<div class="local-path" title="Mac Mini path">💻 Local: ${escapeHtml(p.localPath)}</div>`;
  }

  const branchInfo = (p.branches && p.branches.length)
    ? `<span class="branch-info" title="Git branches">⎇ ${p.branches.map(escapeHtml).join(", ")}</span>`
    : "";

  return `
    <article class="card${p.githubPages ? " has-live" : ""}" data-slug="${escapeHtml(p.slug)}">
      <div class="card-head">
        <div class="card-name${nameLinked}"${nameClick}>${escapeHtml(p.name)}</div>
      </div>
      <div class="badges">
        <span class="badge status-${escapeHtml(p.status)}">${escapeHtml(statusLabel)}</span>
        <span class="badge type">${escapeHtml(typeLabel)}</span>
      </div>
      <p class="card-desc">${escapeHtml(p.description)}</p>
      <div class="meta-row">
        <span class="agents">Built by: ${agents || "—"}</span>
      </div>
      ${localBlock}
      ${links ? `<div class="links-row">${links}</div>` : ""}
      <div class="card-foot">
        <span>Updated ${formatDate(p.lastUpdated)}</span>
        ${branchInfo}
      </div>
    </article>
  `;
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render() {
  const visible = sortProjects(PROJECTS.filter(matches));
  const grid = document.getElementById("grid");

  if (visible.length === 0) {
    grid.innerHTML = `<div class="empty">🔍 No projects match your filters.</div>`;
  } else {
    grid.innerHTML = visible.map(renderCard).join("");
  }

  document.getElementById("results-count").innerHTML =
    `Showing <strong>${visible.length}</strong> of ${PROJECTS.length} projects`;
}

/* =========================================================
   INIT
   ========================================================= */
function init() {
  renderStats();
  buildFilters();

  const searchEl = document.getElementById("search");
  searchEl.addEventListener("input", e => {
    state.search = e.target.value.trim();
    render();
  });

  render();
}

document.addEventListener("DOMContentLoaded", init);
</script>
